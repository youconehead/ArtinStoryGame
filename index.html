<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <h1>Home Page of Mystery Game</h1>
    <h4>This is a practice for when you play this game.</h4>
    <img src="image folder/abandon.gif" width="200" alt="abandoned school">
    <figcaption>
        <p>The environemnt you are in</p>
    </figcaption>
    <form method="get" action="game.html">
        <h4>There will be different options to choose from</h4>
        <input type="radio" id="option1" name="choice" value="option1">
        <label for="option1">Option 1</label>
        <input type="radio" id="option2" name="choice" value="option2">
        <label for="option2">Option 2</label>
        <input type="radio" id="option3" name="choice" value="option3">
        <label for="option3">Option 3</label>
        <p></p>
        <h4>There will also be an evidence inventory, which helps you find the suspect</h4>
        <select>
            <option value="Evidence">Evidence 1</option>
            <option value="Evidence">Evidence 2</option>
            <option value="Evidence">Evidence 3</option>
        </select>
        <p></p>
        <input type="submit">
        <p></p>
        <p>Try not to vote for the wrong person, it can lead to a bad ending.</p>
    </form>
</body>
</html>
